name: ci

# O build da imagem não roda aqui: o site da Receita recusa conexões dos runners
# do GitHub (fora do Brasil). Rode `make up && make teste` numa máquina no Brasil.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checagens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Exemplos batem com o gerador
        run: |
          python3 exemplos/gerar_exemplos.py
          git diff --exit-code exemplos/

      - name: Scripts Python compilam
        run: python3 -m py_compile exemplos/*.py

      - name: Scripts shell sem erro de sintaxe
        run: |
          for f in docker/entrypoint.sh scripts/*.sh exemplos/*.sh; do bash -n "$f"; done
          shellcheck -S warning docker/entrypoint.sh scripts/*.sh exemplos/*.sh

      - name: Compose válido
        run: docker compose config -q

      - name: Dockerfile sem aviso
        run: docker build --check .
