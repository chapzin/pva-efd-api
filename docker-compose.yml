# Sobe o validador em http://127.0.0.1:8095 (só acessível desta máquina).
#   docker compose up -d --build
services:
  pva:
    build: .
    image: pva-efd-api:6.1.1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Não há autenticação: não troque 127.0.0.1 por 0.0.0.0 sem um proxy na frente.
      # Porta na sua máquina: PVA_PORTA_HOST=8099 docker compose up -d
      - "127.0.0.1:${PVA_PORTA_HOST:-8095}:8095"
    mem_limit: 2g
    volumes:
      # Pasta que o MCP (/mcp) enxerga, só leitura. Ex.: PVA_DADOS=$HOME/auditorias docker compose up -d
      - "${PVA_DADOS:-./dados}:/dados:ro"
      # Onde efd_livro grava os PDFs dos livros (a única pasta com escrita).
      - "${PVA_SAIDA:-./saida}:/saida"
    environment:
      # Baixa as tabelas externas da Receita no boot e a cada N horas (0 = só manual).
      PVA_ATUALIZAR_TABELAS_HORAS: "24"
      # Tamanho máximo do TXT aceito em /validar.
      PVA_LIMITE_MB: "512"
      # O mesmo caminho do host, para o Claude poder passar o caminho que ele conhece.
      PVA_DADOS_HOST: "${PVA_DADOS:-}"
      PVA_SAIDA_HOST: "${PVA_SAIDA:-}"
